<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crosscut Daily Five — visual comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #cfc9bc; color: #16130b; font-family: Arial, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #554f43; }
    main { display: flex; gap: 28px; align-items: flex-start; }
    section { width: 470px; }
    h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .frame { width: 470px; height: 900px; border: 2px solid #16130b; background: #efe9db; overflow: hidden; }
    img { display: block; width: 413px; height: 900px; object-fit: fill; margin: 0 auto; }
    iframe { display: block; width: 470px; height: 900px; border: 0; }
  </style>
</head>
<body>
  <h1>Daily Five / Today's Drop</h1>
  <p>Selected direction beside the current interactive implementation.</p>
  <main>
    <section>
      <h2>Source direction</h2>
      <div class="frame"><img src="./references/daily-five-todays-drop.png" alt="Selected Today's Drop design direction"></div>
    </section>
    <section>
      <h2>Interactive implementation</h2>
      <div class="frame"><iframe src="./Crosscut%20Prototype.dc.html?screen=feed" title="Crosscut prototype feed"></iframe></div>
    </section>
  </main>
</body>
</html>
